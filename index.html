<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roulette Analyzer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding-top: 60px;
    }

    .card {
      width: 320px;
      margin: auto;
      background: #1d1d1d;
      padding: 30px;
      border-radius: 14px;
    }

    #numero {
      font-size: 90px;
      font-weight: bold;
      margin: 20px 0;
    }

    #status {
      font-size: 22px;
      font-weight: bold;
    }

    .online {
      color: #21d07a;
    }

    .offline {
      color: #ff4d4d;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>ROULETTE ANALYZER</h2>

    <div>ÚLTIMO RESULTADO</div>

    <div id="numero">--</div>

    <div id="horario">Horário: --</div>

    <br>

    <div id="status" class="offline">
      🔴 OFFLINE
    </div>
  </div>

  <script>
    async function atualizar() {
      try {
        const resposta = await fetch("/estado");
        const estado = await resposta.json();

        document.getElementById("numero").textContent =
          estado.numero ?? "--";

        document.getElementById("horario").textContent =
          "Horário: " + (estado.horario ?? "--");

        const status = document.getElementById("status");

        if (estado.online) {
          status.textContent = "🟢 ONLINE";
          status.className = "online";
        } else {
          status.textContent = "🔴 OFFLINE";
          status.className = "offline";
        }

      } catch (erro) {
        document.getElementById("status").textContent =
          "🔴 OFFLINE";
      }
    }

    atualizar();

    setInterval(atualizar, 1000);
  </script>

</body>
</html>
